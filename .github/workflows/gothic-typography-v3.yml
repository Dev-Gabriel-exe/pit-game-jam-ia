name: Gothic typography V3 QA
on:
  push:
    branches:
      - feature/gothic-typography-v3-20261028
  pull_request:
    paths:
      - 'v3/gothic-typography-v3.css'
      - 'professor-v3.html'
      - 'aluno-v3.html'
      - 'qa/gothic-typography-v3.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typography-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check teacher and student readability
        run: |
          node --check qa/gothic-typography-v3.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-font-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/gothic-typography-v3.cjs
