name: V5 Endgame Freeze Regression — exact seed and 30 real GLBs
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/arena-lab.*'
      - 'v5/arena-three.js'
      - 'v5/phase2-combat.js'
      - 'v5/talent-sprites.js'
      - 'qa/v5-endgame-*.cjs'
      - '.github/workflows/v5-endgame-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endgame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exact S24 seed must finish at 63.3 simulation seconds
        run: node qa/v5-endgame-replay.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Full 30-player GUI endgame and background pause
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-endgame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-endgame-browser.cjs
