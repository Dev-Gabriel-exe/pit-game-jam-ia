name: V5 H0 — Contrato Pedagógico Isolado
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/progression-contract-h0.js'
      - 'qa/v5-progression-contract-h0.cjs'
      - '.github/workflows/v5-progression-contract-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and policy invariants
        run: |
          node --check v5/progression-contract-h0.js
          node --check qa/v5-progression-contract-h0.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-endgame-replay.cjs
          node qa/v5-camera-viewer.cjs
