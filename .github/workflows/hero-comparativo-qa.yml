name: Hero comparison preview QA
on:
  push:
    branches:
      - feature/comparativo-hero-3-videos-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test isolated preview
        run: |
          node --check qa/hero-comparativo.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/hero-comparativo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/hero-comparativo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-comparativo-screenshots
          path: qa/comparativo-hero-*.png
          retention-days: 7
          if-no-files-found: ignore
