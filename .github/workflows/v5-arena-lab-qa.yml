name: V5 Arena Lab — GLBs reais e teste M5/M10
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/arena-lab.*'
      - 'v5/arena-three.js'
      - 'v5/arena-citadel.js'
      - 'qa/v5-arena-lab*'
      - '.github/workflows/v5-arena-lab-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          node --check v5/arena-lab.js
          node --check v5/arena-three.js
          node --check v5/arena-citadel.js
          node --check qa/v5-arena-lab.cjs
          node --check qa/v5-arena-lab-browser.cjs
          node qa/v5-arena-lab.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-arena-lab.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-arena-lab-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-arena-lab-browser-screenshots
          path: qa/v5-arena-lab-*.png
          if-no-files-found: ignore
          retention-days: 7
