name: V5 Arena Lab — GLBs reais e teste M5/M10
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/arena-lab.*'
      - 'v5/arena-three.js'
      - 'v5/character-assets.js'
      - 'v5/talent-vfx.js'
      - 'v5/talent-sprites.js'
      - 'qa/v5-talent-sprites.cjs'
      - 'qa/v5-talent-sprites-browser.cjs'
      - 'v5/talent-choreography.js'
      - 'v5/build-identity.js'
      - 'qa/v5-build-identity.cjs'
      - 'qa/v5-build-identity-browser.cjs'
      - 'v5/arena-lab.css'
      - 'v5/C3-IDENTIDADE-VISUAL.md'
      - 'qa/v5-talent-choreography.cjs'
      - 'qa/v5-talent-choreography-browser.cjs'
      - 'qa/v5-talent-vfx.cjs'
      - 'qa/v5-talent-vfx-browser.cjs'
      - 'v5/arena-citadel.js'
      - 'v5/hero-core.js'
      - 'v5/phase2-combat.js'
      - 'v5/forja-core.js'
      - 'qa/v5-forge*'
      - 'qa/v5-phase2-combat.cjs'
      - 'qa/v5-phase2-expansion.cjs'
      - 'qa/v5-phase2-next-paths.cjs'
      - 'qa/v5-phase2-b4.cjs'
      - 'qa/v5-phase2-b5.cjs'
      - 'qa/v5-phase2-b6.cjs'
      - 'qa/v5-phase2-browser.cjs'
      - 'qa/v5-arena-physics-fairness.cjs'
      - 'qa/v5-arena-navigation.cjs'
      - 'qa/v5-arena-targeting.cjs'
      - 'qa/v5-arena-balance-matrix.cjs'
      - 'qa/v5-arena-lab*'
      - 'qa/v5-coliseum-scale.cjs'
      - 'qa/v5-arena-pacing.cjs'
      - 'qa/v5-engagement-spread.cjs'
      - 'qa/v5-tank-survivability.cjs'
      - 'qa/v5-phase2-navigation.cjs'
      - 'qa/v5-ranged-counterplay.cjs'
      - 'qa/v5-hp-balance.cjs'
      - '.github/workflows/v5-arena-lab-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          node --check v5/arena-lab.js
          node --check v5/arena-three.js
          node --check v5/talent-vfx.js
          node --check v5/talent-sprites.js
          node --check qa/v5-talent-sprites.cjs
          node --check qa/v5-talent-sprites-browser.cjs
          node --check v5/talent-choreography.js
          node --check v5/build-identity.js
          node --check qa/v5-build-identity.cjs
          node --check qa/v5-build-identity-browser.cjs
          node --check qa/v5-talent-choreography.cjs
          node --check qa/v5-talent-choreography-browser.cjs
          node --check qa/v5-talent-vfx.cjs
          node --check qa/v5-talent-vfx-browser.cjs
          node --check v5/arena-citadel.js
          node --check qa/v5-arena-lab.cjs
          node --check qa/v5-arena-lab-browser.cjs
          node --check qa/v5-arena-navigation.cjs
          node --check qa/v5-arena-targeting.cjs
          node --check v5/phase2-combat.js
          node --check qa/v5-phase2-combat.cjs
          node --check qa/v5-phase2-expansion.cjs
          node --check qa/v5-phase2-next-paths.cjs
          node --check qa/v5-phase2-b4.cjs
          node --check qa/v5-phase2-b5.cjs
          node --check qa/v5-phase2-b6.cjs
          node --check qa/v5-phase2-browser.cjs
          node --check qa/v5-arena-physics-fairness.cjs
          node --check qa/v5-coliseum-scale.cjs
          node --check qa/v5-arena-pacing.cjs
          node --check qa/v5-engagement-spread.cjs
          node --check qa/v5-tank-survivability.cjs
          node --check qa/v5-phase2-navigation.cjs
          node --check qa/v5-ranged-counterplay.cjs
          node --check qa/v5-hp-balance.cjs
          node qa/v5-coliseum-scale.cjs
          node qa/v5-arena-pacing.cjs
          node qa/v5-engagement-spread.cjs
          node qa/v5-tank-survivability.cjs
          node qa/v5-phase2-navigation.cjs
          node qa/v5-ranged-counterplay.cjs
          node qa/v5-hp-balance.cjs
          node qa/v5-arena-lab.cjs
          node qa/v5-arena-navigation.cjs
          node qa/v5-arena-targeting.cjs
          node qa/v5-phase2-combat.cjs
          node qa/v5-phase2-expansion.cjs
          node qa/v5-phase2-next-paths.cjs
          node qa/v5-phase2-b4.cjs
          node qa/v5-phase2-b5.cjs
          node qa/v5-phase2-b6.cjs
          node qa/v5-talent-vfx.cjs
          node qa/v5-talent-sprites.cjs
          node qa/v5-talent-choreography.cjs
          node qa/v5-build-identity.cjs
          node qa/v5-arena-physics-fairness.cjs
          node qa/v5-arena-balance-matrix.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-arena-lab.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-arena-lab-browser.cjs
          node qa/v5-phase2-browser.cjs
          node qa/v5-talent-vfx-browser.cjs
          node qa/v5-talent-sprites-browser.cjs
          node qa/v5-talent-choreography-browser.cjs
          node qa/v5-build-identity-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-arena-lab-browser-screenshots
          path: qa/v5-arena-lab-*.png
          if-no-files-found: ignore
          retention-days: 7
