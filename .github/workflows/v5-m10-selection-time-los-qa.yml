name: V5 M10 Selection-Time LOS — Isolated QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-selection-time-los.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-selection-time-los-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-selection-time-los:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and mission regression
        run: |
          node --check v5/phase2-combat.js
          node --check qa/v5-m10-selection-time-los.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-endgame-replay.cjs
      - name: Exact selection-time LOS and full replay parity
        run: node qa/v5-m10-selection-time-los.cjs
        env:
          M10_TARGET_TRACE_REPORT_FILE: qa/out/m10-selection-time-los.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-selection-time-los-report
          path: qa/out/m10-selection-time-los.json
          retention-days: 14
          if-no-files-found: ignore
