name: V5 Quaternius nature scenery QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/arena-three.js'
      - 'v5/assets/quaternius-nature/**'
      - 'qa/v5-quaternius-nature*.cjs'
      - '.github/workflows/v5-quaternius-nature-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check v5/arena-three.js
          node qa/v5-quaternius-nature.cjs
  chromium-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/quaternius-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-quaternius-nature-browser.cjs
