name: V5 F3 — Câmera do Aluno e Espectadores
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/camera-viewer.js'
      - 'v5/camera-director.js'
      - 'v5/camera-framing.js'
      - 'v5/arena-three.js'
      - 'v5/arena-lab.*'
      - 'qa/v5-camera-viewer*.cjs'
      - '.github/workflows/v5-camera-viewer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          node --check v5/camera-viewer.js
          node --check v5/arena-three.js
          node --check v5/arena-lab.js
          node --check qa/v5-camera-viewer.cjs
          node --check qa/v5-camera-viewer-browser.cjs
          node qa/v5-camera-viewer.cjs
          node qa/v5-camera-director.cjs
          node qa/v5-camera-framing.cjs
          node qa/v5-endgame-replay.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-f3-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-camera-viewer-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-f3-student-spectator-30
          path: qa/v5-camera-f3-student-spectator-30.png
          if-no-files-found: ignore
