name: V5 Fase 2 - Catalogo de Talentos (planejamento)
on:
  push:
    branches:
      - feature/v5-arena-dos-criadores
    paths:
      - 'v5/fase2-progression-plan.json'
      - 'v5/talents-*-plan.json'
      - 'qa/v5-fase2-planning.cjs'
      - '.github/workflows/v5-fase2-planning-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate all 120 planned talents
        run: node qa/v5-fase2-planning.cjs
