name: V5 M10 — 30-player Full Shared Feed Fictional QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-h2-fullstream.cjs'
      - 'qa/v5-shared-arena-feed-h2.cjs'
      - 'v5/shared-arena-feed-h2-lab.js'
      - 'v5/phase2-combat.js'
      - 'v5/camera-director.js'
      - 'v5/teacher-arena-release-lab.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-h2-fullstream-qa.yml'
  workflow_dispatch:
jobs:
  m10-fullstream-fictional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check qa/v5-m10-h2-fullstream.cjs
      - run: node qa/v5-m10-h2-fullstream.cjs
      - run: node qa/v5-shared-arena-feed-h2.cjs
      - run: node qa/v5-m10-engine.cjs
