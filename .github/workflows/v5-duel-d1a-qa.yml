name: V5 D1a Duel Invitations and Concurrency
on:
  push:
    branches: [feature/v5-duelos-d1a]
    paths:
      - 'v5/migration-d1a-duelos.sql'
      - 'chat-api/lib/v5-duel-d1a-service.js'
      - 'chat-api/lib/v5-duel-d1a-handler.js'
      - 'chat-api/api/duel-v2-lab.js'
      - 'qa/v5-duel-d1a-postgres.cjs'
      - 'v5/duel-lab-d1a.html'
      - 'v5/duel-lab-d1a.js'
      - 'v5/duel-lab-d1a.css'
      - 'qa/v5-duel-d1a-browser.cjs'
      - '.github/workflows/v5-duel-d1a-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invitations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: pit_v5_duel_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pit_v5_duel_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pit_v5_duel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check chat-api/lib/v5-duel-d1a-service.js
          node --check chat-api/lib/v5-duel-d1a-handler.js
          node --check chat-api/api/duel-v2-lab.js
          node --check qa/v5-duel-d1a-postgres.cjs
      - run: npm install --no-save --no-package-lock pg@8.13.1
      - name: Create disposable classroom and duel schema
        run: |
          psql -v ON_ERROR_STOP=1 -f qa/v5-h1d-staging-schema.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE pit_students ADD COLUMN display_name text NOT NULL DEFAULT 'Aluno fictício'"
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1a-duelos.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1a-duelos.sql
      - run: node qa/v5-duel-d1a-postgres.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check v5/duel-lab-d1a.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise fictional duel lobby in Chromium
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-d1a-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-duel-d1a-browser.cjs
