name: Generate Mission 01 with Free Anonymous LTX
on:
  push:
    branches: [experiment/missao-01-ltx-anon]
    paths:
      - 'scripts/ltx-anon-generate.py'
      - '.github/workflows/ltx-anon-generate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image-to-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client (does not install models or start a paid instance)
        run: python -m pip install --disable-pip-version-check -q "gradio_client>=1.10,<3"
      - name: Generate from original Gothic Mission 01 artwork through public ZeroGPU
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_TOKEN: ''
          HUGGING_FACE_HUB_TOKEN: ''
        run: python scripts/ltx-anon-generate.py
      - name: Save verified genuine LTX video to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/assets/missions/missao-01-motion.mp4
          if ! git diff --cached --quiet; then
            git commit -m "feat(test): genuine anonymous LTX image-to-video Mission 01 [skip ci]"
            git push
          fi
