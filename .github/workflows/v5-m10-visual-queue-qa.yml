name: V5 H3 — M10 Bounded Visual Queue Contract
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/m10-visual-queue.js'
      - 'qa/v5-m10-visual-queue.cjs'
      - '.github/workflows/v5-m10-visual-queue-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and bounded queue contract
        run: |
          node --check v5/m10-visual-queue.js
          node --check qa/v5-m10-visual-queue.cjs
          node qa/v5-m10-visual-queue.cjs
      - name: Preserve M5 and M10 pedagogical contract
        run: |
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs
