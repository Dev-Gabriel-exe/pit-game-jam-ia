name: V5 H3 — M10 Bounded Visual Queue Contract
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/m10-visual-queue.js'
      - 'qa/v5-m10-visual-queue.cjs'
      - 'v5/arena-three.js'
      - 'v5/arena-lab.html'
      - 'qa/v5-m10-rare-equipped-browser.cjs'
      - '.github/workflows/v5-m10-visual-queue-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and bounded queue contract
        run: |
          node --check v5/m10-visual-queue.js
          node --check qa/v5-m10-visual-queue.cjs
          node qa/v5-m10-visual-queue.cjs
      - name: Preserve M5 and M10 pedagogical contract
        run: |
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs

  queue-first-frame-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate syntax and H0/M5 contract
        run: |
          node --check v5/arena-three.js
          node --check qa/v5-m10-rare-equipped-browser.cjs
          node qa/v5-m10-visual-queue.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-rare-equipped-seed.cjs
      - name: Install isolated Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify 30 KayKit M10 queued rare effects in rendered WebGL frames
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-m10-queue.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          M10_VISUAL_QUEUE=1 M10_FX_PROBE=1 M10_RARE_PREFIX=qa/v5-m10-queue-webgl node qa/v5-m10-rare-equipped-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-queued-rare-webgl
          path: |
            qa/v5-m10-queue-webgl.json
            qa/v5-m10-queue-webgl-*.png
          if-no-files-found: ignore
