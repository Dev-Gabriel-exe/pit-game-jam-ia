name: V5 M10 LOS Combat Trial — Isolated QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-los-combat-trial.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-los-combat-trial-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-los-combat-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and progression safeguards
        run: |
          node --check v5/phase2-combat.js
          node --check qa/v5-m10-los-combat-trial.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-endgame-replay.cjs
      - name: Paired M10 opt-in target visibility vs baseline
        run: node qa/v5-m10-los-combat-trial.cjs
        env:
          M10_LOS_COMBAT_REPORT_FILE: qa/out/m10-los-combat-trial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-los-combat-trial-report
          path: qa/out/m10-los-combat-trial.json
          retention-days: 14
          if-no-files-found: ignore
