name: V5 Duel Invitations Fictional Contract QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/duel-invitations-lab.js'
      - 'qa/v5-duel-invitations-lab.cjs'
      - 'qa/v5-duel-window-lab.cjs'
      - 'qa/v5-duel-window-browser.cjs'
      - 'v5/duel-window-lab.html'
      - 'v5/duel-battle-lab.js'
      - 'v5/duel-3d-lab.js'
      - 'v5/arena-three.js'
      - 'v5/character-assets.js'
      - 'v5/phase2-combat.js'
      - 'qa/v5-duel-battle-lab.cjs'
      - 'qa/v5-duel-3d-browser.cjs'
      - '.github/workflows/v5-duel-invitations-lab-qa.yml'
  workflow_dispatch:
jobs:
  fictional-duel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check v5/duel-invitations-lab.js
      - run: node --check qa/v5-duel-invitations-lab.cjs
      - run: node qa/v5-duel-invitations-lab.cjs
      - run: node qa/v5-duel-window-lab.cjs
      - run: node --check v5/duel-battle-lab.js
      - run: node --check qa/v5-duel-battle-lab.cjs
      - run: node qa/v5-duel-battle-lab.cjs
      - run: node --input-type=module --check < v5/duel-3d-lab.js

  fictional-duel-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          node --check qa/v5-duel-window-browser.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/duel-window.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-duel-window-browser.cjs
          node qa/v5-duel-3d-browser.cjs
