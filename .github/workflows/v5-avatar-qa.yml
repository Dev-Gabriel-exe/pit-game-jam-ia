name: V5 Quatro Heróis — mesma origem, mesma escala, animações reais
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/character-assets.js'
      - 'v5/arena-three.js'
      - 'v5/personagens-lab.*'
      - 'qa/v5-four-classes*.cjs'
      - '.github/workflows/v5-avatar-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          node --check v5/character-assets.js
          node --check v5/personagens-lab.js
          node --check qa/v5-four-classes.cjs
          node --check qa/v5-four-classes-browser.cjs
          node qa/v5-four-classes.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-four-heroes.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-four-classes-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v5-four-hero-model-comparison
          path: qa/v5-kaykit-four-models-mobile.png
          if-no-files-found: ignore
