name: V5 Arsenal — 40 personagens gratuitos e reserva simulada
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/avatar-catalog.js'
      - 'v5/personagens-lab.*'
      - 'qa/v5-avatar-*.cjs'
      - '.github/workflows/v5-avatar-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          node --check v5/avatar-catalog.js
          node --check v5/personagens-lab.js
          node --check qa/v5-avatar-catalog.cjs
          node qa/v5-avatar-catalog.cjs
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-arsenal.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-avatar-gallery-browser.cjs
