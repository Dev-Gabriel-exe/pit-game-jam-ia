name: V5 Teacher Collective Arena — Fictional M5/M10 QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/teacher-arena-release-lab.js'
      - 'v5/teacher-arena-lab.html'
      - 'v5/teacher-arena-lab.js'
      - 'qa/v5-teacher-arena-release-lab.cjs'
      - 'qa/v5-teacher-arena-static.cjs'
      - 'qa/v5-teacher-arena-browser.cjs'
      - '.github/workflows/v5-teacher-arena-lab-qa.yml'
  workflow_dispatch:
jobs:
  teacher-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check v5/teacher-arena-release-lab.js
      - run: node --input-type=module --check < v5/teacher-arena-lab.js
      - run: node --check qa/v5-teacher-arena-release-lab.cjs
      - run: node --check qa/v5-teacher-arena-static.cjs
      - run: node qa/v5-teacher-arena-release-lab.cjs
      - run: node qa/v5-teacher-arena-static.cjs
      - run: node qa/v5-progression-contract-h0.cjs
      - run: node qa/v5-m10-engine.cjs

  teacher-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          node --check qa/v5-teacher-arena-browser.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-teacher-lab.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-teacher-arena-browser.cjs
