name: V5 M10 Factorial Seed Crossover QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-factorial-seed-crossover.cjs'
      - 'qa/v5-m10-factorial-seed-analysis.cjs'
      - 'qa/v5-m10-first-contact.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-factorial-seed-crossover-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and M5/M10 progression regression
        run: |
          node --check qa/v5-m10-factorial-seed-crossover.cjs
          node --check qa/v5-m10-factorial-seed-analysis.cjs
          node --check qa/v5-m10-first-contact.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-endgame-replay.cjs
      - name: Factorial expanded seed test (768 M10 battles, 864 arm observations)
        run: node qa/v5-m10-factorial-seed-crossover.cjs
        env:
          M10_FACTORIAL_REPORT_FILE: qa/out/m10-factorial-seed-crossover.json
      - name: Seed-clustered interaction and uncertainty analysis
        run: node qa/v5-m10-factorial-seed-analysis.cjs qa/out/m10-factorial-seed-crossover.json
        env:
          M10_FACTORIAL_ANALYSIS_FILE: qa/out/m10-factorial-seed-analysis.json
      - name: M10 first-contact proximity and early targeting diagnostic (144 synthetic battles)
        run: node qa/v5-m10-first-contact.cjs
        env:
          M10_FIRST_CONTACT_REPORT_FILE: qa/out/m10-first-contact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-factorial-seed-crossover
          path: |
            qa/out/m10-factorial-seed-crossover.json
            qa/out/m10-factorial-seed-analysis.json
            qa/out/m10-first-contact.json
          retention-days: 14
          if-no-files-found: ignore
