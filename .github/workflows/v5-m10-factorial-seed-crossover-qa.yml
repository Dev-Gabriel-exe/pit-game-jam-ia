name: V5 M10 Factorial Seed Crossover QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-factorial-seed-crossover.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-factorial-seed-crossover-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and M5/M10 progression regression
        run: |
          node --check qa/v5-m10-factorial-seed-crossover.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-endgame-replay.cjs
      - name: Factorial independent seed test (384 M10 battles, 432 arm observations)
        run: node qa/v5-m10-factorial-seed-crossover.cjs
        env:
          M10_FACTORIAL_REPORT_FILE: qa/out/m10-factorial-seed-crossover.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-factorial-seed-crossover
          path: qa/out/m10-factorial-seed-crossover.json
          retention-days: 14
          if-no-files-found: ignore
