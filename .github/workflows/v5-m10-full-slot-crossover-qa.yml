name: V5 M10 Full Slot Crossover QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-full-slot-crossover.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-full-slot-crossover-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-full-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and progression regression
        run: |
          node --check qa/v5-m10-full-slot-crossover.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-endgame-replay.cjs
      - name: 396 M10 battles with complete slot rotations
        run: node qa/v5-m10-full-slot-crossover.cjs
        env:
          M10_CROSSOVER_REPORT_FILE: qa/out/m10-full-slot-crossover.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-full-slot-crossover
          path: qa/out/m10-full-slot-crossover.json
          retention-days: 14
          if-no-files-found: ignore
