name: V5 Arena Audio QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/arena-audio.js'
      - 'v5/arena-three.js'
      - 'qa/v5-arena-audio*.cjs'
      - '.github/workflows/v5-arena-audio-qa.yml'
  workflow_dispatch:
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/v5-arena-audio.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser 30 GLB audio regression
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-audio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-arena-audio-browser.cjs
