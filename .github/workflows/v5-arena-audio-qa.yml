name: V5 Arena Audio QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/arena-audio.js'
      - 'v5/arena-three.js'
      - 'qa/v5-arena-audio.cjs'
      - '.github/workflows/v5-arena-audio-qa.yml'
  workflow_dispatch:
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/v5-arena-audio.cjs
