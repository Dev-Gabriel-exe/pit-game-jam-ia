name: Portal cinematic hero QA
on:
  push:
    branches:
      - feature/portal-hero-cinematico-parallax-20261028
  pull_request:
    paths:
      - 'index.html'
      - 'v3/portal-cinematic.*'
      - 'qa/portal-cinematic-browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test hero video, motion, accessibility and portal links
        run: |
          node --check v3/portal-cinematic.js
          node --check qa/portal-cinematic-browser.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-portal.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/portal-cinematic-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-cinematic-screenshots
          path: qa/portal-cinematic-*.png
          if-no-files-found: ignore
          retention-days: 7
