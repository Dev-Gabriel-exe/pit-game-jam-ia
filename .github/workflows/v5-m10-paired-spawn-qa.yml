name: V5 M10 — Pareamento de Posições
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-paired-spawn.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-paired-spawn-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-slot-order:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check script syntax
        run: node --check qa/v5-m10-paired-spawn.cjs
      - name: Execute paired slot/order M10 crossover
        env:
          M10_PAIRED_REPORT_FILE: ${{ runner.temp }}/m10-paired-slot-order.json
        run: node qa/v5-m10-paired-spawn.cjs
      - name: Retain anonymous paired report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-m10-paired-slot-order
          path: ${{ runner.temp }}/m10-paired-slot-order.json
          if-no-files-found: warn
          retention-days: 14
