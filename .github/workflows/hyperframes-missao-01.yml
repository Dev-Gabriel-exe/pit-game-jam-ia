name: HyperFrames Gothic Mission One
on:
  push:
    branches: [experiment/missao-01-hyperframes]
    paths:
      - 'experiments/hyperframes-missao-01/**'
      - '.github/workflows/hyperframes-missao-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: HyperFrames CLI and sanity
        working-directory: experiments/hyperframes-missao-01
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: '1'
          CI: 'true'
        run: |
          npx --yes hyperframes@0.8.86 --version
          npx --yes hyperframes@0.8.86 lint
      - name: Render six-second gothic movie with official HyperFrames
        working-directory: experiments/hyperframes-missao-01
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: '1'
          CI: 'true'
        run: |
          npx --yes hyperframes@0.8.86 render --quality draft --fps 24 --output ../../v3/assets/missions/missao-01-motion.mp4
      - name: Inspect generated MP4 stream
        run: |
          test -s v3/assets/missions/missao-01-motion.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -show_entries format=duration,size -of json v3/assets/missions/missao-01-motion.mp4
      - name: Commit rendered MP4 to the test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/assets/missions/missao-01-motion.mp4
          if ! git diff --cached --quiet; then
            git commit -m "chore(hyperframes): render cinematic mission 01 scene [skip ci]"
            git push
          fi