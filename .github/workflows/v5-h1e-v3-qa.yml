name: V5 H1e V3 Sunday Integration QA
on:
  push:
    branches: [feature/v5-h1e-v3-integracao-domingo]
    paths:
      - 'v3/v5-h1e-*'
      - 'v3/app.js'
      - 'aluno-v3.html'
      - 'professor-v3.html'
      - 'v5/hero-lab-h1d.js'
      - 'v5/duel-lobby-d1c.js'
      - 'v5/duel-teacher-d1c.js'
      - 'qa/v5-h1e-v3-browser.cjs'
      - '.github/workflows/v5-h1e-v3-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static check on bridge, V3, student and teacher demos
        run: |
          node --check v3/app.js
          node --check v3/v5-h1e-bridge.js
          node --check v5/hero-lab-h1d.js
          node --check v5/duel-lobby-d1c.js
          node --check v5/duel-teacher-d1c.js
          node --check qa/v5-h1e-v3-browser.cjs
      - name: Install headless Chromium and locally mapped Three.js
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.186.1
          npx playwright install --with-deps chromium
      - name: Validate both V3 portals, all ten missions and embedded V5 UX
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-h1e-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-h1e-v3-browser.cjs
