name: V5 H3 — M10 Guardian Build Diversity
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - 'qa/v5-m10-guardian-build-diversity.cjs'
      - '.github/workflows/v5-m10-guardian-build-diversity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-build-diversity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax
        run: |
          node --check v5/phase2-combat.js
          node --check qa/v5-m10-guardian-build-diversity.cjs
      - name: Diverse M10 builds and M5/H0 regressions
        env:
          M10_GUARDIAN_DIVERSITY_REPORT_FILE: /tmp/v5-m10-guardian-build-diversity.json
        run: |
          node qa/v5-m10-guardian-build-diversity.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-endgame-replay.cjs
      - name: Attach anonymous diversity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-m10-guardian-build-diversity
          path: /tmp/v5-m10-guardian-build-diversity.json
          if-no-files-found: ignore
          retention-days: 14
