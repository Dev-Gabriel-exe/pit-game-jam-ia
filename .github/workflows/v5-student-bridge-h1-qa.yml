name: V5 H1 Student Bridge QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/student-bridge-h1.js'
      - 'v5/progression-contract-h0.js'
      - 'v5/phase2-combat.js'
      - 'qa/v5-student-bridge-h1.cjs'
      - '.github/workflows/v5-student-bridge-h1-qa.yml'
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check v5/student-bridge-h1.js
      - run: node qa/v5-student-bridge-h1.cjs
      - run: node qa/v5-progression-contract-h0.cjs
