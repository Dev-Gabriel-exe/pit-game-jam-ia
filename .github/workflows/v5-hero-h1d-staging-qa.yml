name: V5 H1d Two-Browser Staging Integration
on:
  push:
    branches: [feature/v5-h1b-integration-safe]
    paths:
      - 'v5/hero-lab-h1d.html'
      - 'v5/hero-lab-h1d.js'
      - 'v5/hero-v2-client-h1c.js'
      - 'chat-api/lib/v5-build-v2-contract.js'
      - 'chat-api/lib/v5-builds-v2-repository.js'
      - 'chat-api/lib/v5-hero-v2-handler.js'
      - 'chat-api/lib/v5-phase2-talent-ids.json'
      - 'v5/migration-h1b-builds-v2.sql'
      - 'qa/v5-h1d-staging-schema.sql'
      - 'qa/v5-hero-h1d-server.cjs'
      - 'qa/v5-hero-h1d-two-browser.cjs'
      - '.github/workflows/v5-hero-h1d-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: pit_v5_h1d_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pit_v5_h1d_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pit_v5_h1d_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts before starting fixture
        run: |
          node --check v5/hero-lab-h1d.js
          node --check qa/v5-hero-h1d-server.cjs
          node --check qa/v5-hero-h1d-two-browser.cjs
      - name: Install Chromium and postgres driver for local-only QA
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 pg@8.13.1
          npx playwright install --with-deps chromium
      - name: Create disposable classroom and versioned hero table
        run: |
          psql -v ON_ERROR_STOP=1 -f qa/v5-h1d-staging-schema.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-h1b-builds-v2.sql
      - name: Two browser conflict, lock and persistence regression
        run: |
          node qa/v5-hero-h1d-server.cjs >/tmp/v5-h1d-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8899/__h1d_health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8899/__h1d_health
          node qa/v5-hero-h1d-two-browser.cjs
