name: V5 H3 — M10 Frozen M5 Guardian Extras
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - 'qa/v5-m10-guardian-m5-fixed-extras-paired.cjs'
      - '.github/workflows/v5-m10-guardian-m5-fixed-extras-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-fixed-m5-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and frozen-M5 paired M10 extra-talent trials
        env:
          M10_GUARDIAN_FIXED_EXTRAS_REPORT_FILE: /tmp/v5-m10-guardian-fixed-extras.json
        run: |
          node --check qa/v5-m10-guardian-m5-fixed-extras-paired.cjs
          node --check v5/phase2-combat.js
          node qa/v5-m10-guardian-m5-fixed-extras-paired.cjs
      - name: M10 engine, H0 contract and M5 regression
        run: |
          node qa/v5-m10-engine.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-endgame-replay.cjs
      - name: Attach anonymous paired report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-m10-guardian-fixed-m5-extras
          path: /tmp/v5-m10-guardian-fixed-extras.json
          if-no-files-found: ignore
          retention-days: 14
