name: V6 Forensics - Real KayKit Duels
on:
  push:
    branches: [v6]
    paths:
      - 'qa/v6-duel-real-assets-browser.cjs'
      - '.github/workflows/v6-real-assets-duel.yml'
      - 'v5/arena-three.js'
      - 'v5/coliseum-live.js'
      - 'v5/coliseum-live.html'
      - 'v5/character-assets.js'
      - 'v5/kaykit-motion-pack.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-assets-two-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      V6_WATCH_MS: '26000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test packages only
        run: |
          npm install --prefix chat-api --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.186.1
      - run: npx playwright install --with-deps chromium
      - name: Test two real tabs with genuine KayKit 3D models
        run: node qa/v6-duel-real-assets-browser.cjs
