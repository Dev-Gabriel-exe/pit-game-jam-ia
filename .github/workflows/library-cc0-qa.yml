name: Biblioteca CC0 real QA
on:
  push:
    branches: [feature/biblioteca-cc0-real-20261028]
  pull_request:
    paths:
      - 'index.html'
      - 'v3/library-open-assets.*'
      - 'qa/library-cc0-browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test real asset downloads, filters, model preview and responsiveness
        run: |
          node --check v3/library-open-assets.js
          node --check qa/library-cc0-browser.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/cc0-pit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/library-cc0-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc0-library-screens
          path: qa/biblioteca-cc0-*.png
          retention-days: 7
          if-no-files-found: ignore
