name: PIT Game Jam — Isolated Postgres QA
on:
  push:
    paths:
      - 'chat-api/api/**'
      - 'qa/v3-postgres-integration.cjs'
      - '.github/workflows/postgres-isolated-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-isolated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pit
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pit -d pit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://pit@127.0.0.1:5432/pit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated API dependency
        run: npm install --prefix chat-api --ignore-scripts --no-audit --no-fund
      - name: Syntax check isolated Postgres suite
        run: node --check qa/v3-postgres-integration.cjs
      - name: Execute actual handlers against disposable Postgres 16
        run: node qa/v3-postgres-integration.cjs
