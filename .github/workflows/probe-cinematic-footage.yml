name: Probe Cinematic Gothic Free Footage
on:
  push:
    branches: [experiment/missao-01-cinematic-footage]
    paths: ['.github/workflows/probe-cinematic-footage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public Pixabay preview resources
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html,json
          urls=[
          'https://pixabay.com/videos/magical-portal-glowing-doorway-348295/',
          'https://pixabay.com/videos/ai-generated-black-cat-353558/',
          'https://pixabay.com/videos/castle-ruins-portal-fantasy-166619/',
          'https://pixabay.com/videos/horror-castle-fantasy-gothic-66791/',
          ]
          for url in urls:
           print("\nSOURCE:",url,flush=True)
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=12) as r:
             s=r.read().decode('utf-8','replace')
             print("STATUS",r.status,"SIZE",len(s))
            ss=html.unescape(s.replace('\\/','/').replace('\\u002F','/'))
            for pattern in [r'https?://[^\s"<>]+?\.mp4[^\s"<>]*',r'https?://[^\s"<>]+?\.webm[^\s"<>]*',r'https?://[^\s"<>]+?\.jpg[^\s"<>]*',r'https?://[^\s"<>]+?\.png[^\s"<>]*']:
             found=list(dict.fromkeys(re.findall(pattern,ss,re.I)))
             print("MATCHES",pattern,len(found))
             for item in found[:8]:print(" ",item[:330])
           except Exception as e:print('FETCH_ERROR',str(e)[:300])
          PY