name: V5 H3 — M10 G01 G10 Fine Grid Balance
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/phase2-combat.js'
      - 'qa/v5-m10-g01-g10-fine-grid.cjs'
      - '.github/workflows/v5-m10-g01-g10-fine-grid-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fine-grid-paired-shields:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and experimental grid
        run: |
          node --check v5/phase2-combat.js
          node --check qa/v5-m10-g01-g10-fine-grid.cjs
      - name: Paired 600-game G01/G10 fine grid and regressions
        env:
          M10_SHIELD_FINE_GRID_REPORT_FILE: /tmp/v5-m10-g01-g10-fine-grid.json
        run: |
          node qa/v5-m10-g01-g10-fine-grid.cjs
          node qa/v5-m10-guardian-shield-scale.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-endgame-replay.cjs
      - name: Attach anonymous diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-m10-g01-g10-fine-grid-report
          path: /tmp/v5-m10-g01-g10-fine-grid.json
          if-no-files-found: ignore
          retention-days: 14
