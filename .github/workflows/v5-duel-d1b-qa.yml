name: V5 D1b Authoritative Duel Replay QA
on:
  push:
    branches: [feature/v5-duelos-d1b]
    paths:
      - 'chat-api/lib/v5-duel-*'
      - 'chat-api/api/duel-match-v2-lab.js'
      - 'v5/migration-d1b-duel-matches.sql'
      - 'v5/phase2-combat.js'
      - 'qa/v5-duel-d1b-*.cjs'
      - 'v5/duel-replay-d1b.html'
      - 'v5/duel-replay-d1b.css'
      - 'v5/duel-replay-d1b.js'
      - '.github/workflows/v5-duel-d1b-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: pit_v5_d1b_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pit_v5_d1b_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pit_v5_d1b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server runs the EXACT approved combat engine
        run: cmp -s chat-api/lib/v5-duel-phase2-engine.js v5/phase2-combat.js
      - name: Check syntax
        run: |
          node --check chat-api/lib/v5-duel-d1b-replay.js
          node --check chat-api/lib/v5-duel-d1b-service.js
          node --check chat-api/lib/v5-duel-d1b-handler.js
          node --check chat-api/api/duel-match-v2-lab.js
          node --check qa/v5-duel-d1b-postgres.cjs
      - run: npm install --no-save --no-package-lock pg@8.13.1
      - name: Create disposable students, characters, invitations and match tables
        run: |
          psql -v ON_ERROR_STOP=1 -f qa/v5-h1d-staging-schema.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE pit_students ADD COLUMN display_name text NOT NULL DEFAULT 'Aluno fictício'"
          psql -v ON_ERROR_STOP=1 -f v5/migration-h1b-builds-v2.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1a-duelos.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1b-duel-matches.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1b-duel-matches.sql
      - name: Real PostgreSQL shared replay, concurrent starts and finishing
        run: node qa/v5-duel-d1b-postgres.cjs

  spectator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: pit_v5_d1b_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pit_v5_d1b_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pit_v5_d1b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure pinned battle engine matches approved source
        run: cmp -s chat-api/lib/v5-duel-phase2-engine.js v5/phase2-combat.js
      - name: Check browser code and fixture
        run: |
          node --check v5/duel-replay-d1b.js
          node --check qa/v5-duel-d1b-server.cjs
          node --check qa/v5-duel-d1b-browser.cjs
      - name: Install Chromium and its local Three.js dependencies
        run: |
          npm install --no-save --no-package-lock pg@8.13.1 playwright@1.58.2 three@0.186.1
          npx playwright install --with-deps chromium
      - name: Build disposable classroom, builds and duel schema
        run: |
          psql -v ON_ERROR_STOP=1 -f qa/v5-h1d-staging-schema.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE pit_students ADD COLUMN display_name text NOT NULL DEFAULT 'Aluno fictício'"
          psql -v ON_ERROR_STOP=1 -f v5/migration-h1b-builds-v2.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1a-duelos.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1b-duel-matches.sql
      - name: Two authenticated browser replays with real PostgreSQL
        run: |
          node qa/v5-duel-d1b-server.cjs >/tmp/v5-duel-d1b-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8899/__fixture >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8899/__fixture
          node qa/v5-duel-d1b-browser.cjs
