name: V5 Kenney CC0 — 120 Talentos Visuais M5/M10
on:
  push:
    branches: [feature/v5-kenney-talentos-20261102, main]
    paths:
      - 'v5/talent-sprites.js'
      - 'v5/arena-three.js'
      - 'v5/assets/talents/**'
      - 'qa/v5-kenney-vfx*.cjs'
      - '.github/workflows/v5-kenney-talentos-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  talent-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check v5/talent-sprites.js
          node --input-type=module --check < v5/arena-three.js
          node qa/v5-kenney-vfx.cjs
          node qa/v5-talent-vfx.cjs
          node qa/v5-talent-sprites.cjs
          node qa/v5-talent-cinematic.cjs
          node qa/v5-progressao-completa-10-missoes.cjs
  real-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.186.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/kenney-v5.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-kenney-vfx-browser.cjs
