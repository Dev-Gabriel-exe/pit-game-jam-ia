name: Continuous projector M02–M10 QA
on:
  push:
    branches:
      - feature/projetor-continuo-m02-m10-20261028
  pull_request:
    paths:
      - 'v3/teacher-projector-*'
      - 'v3/teacher-mission-*'
      - 'professor-v3.html'
      - 'qa/projector-m02-m10-continuous.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m02-m10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright with Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check syntax and projected classroom behavior
        run: |
          node --check v3/teacher-projector-universal.js
          node --check v3/teacher-projector-m01.js
          node --check qa/projector-m02-m10-continuous.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-projector.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/projector-m02-m10-continuous.cjs
