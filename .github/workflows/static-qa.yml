name: PIT Game Jam QA
on:
  push:
    paths:
      - '**'
      - '.github/workflows/static-qa.yml'
  workflow_dispatch:
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check biblioteca.js
      - name: Audit V3 360-minute mission matrix
        run: node qa/v3-audit-matrix.cjs
      - name: Audit V3 teacher/student alignment
        run: node qa/v3-audit-alignment.cjs
      - name: Audit V3 GDevelop tutorials
        run: node qa/v3-audit-guides.cjs
      - name: Audit V3 AI tools and free licenses
        run: node qa/v3-audit-tools.cjs
      - name: Audit UI routes and local dependencies
        run: node qa/v3-ui-route-inventory.cjs
      - name: Audit V3 library genre and format filters
        run: node qa/v3-library-filters.cjs
      - name: Test UI-06 quick kits ZIP, binary signatures and metadata
        run: |
          node --check v3/quick-kits.js
          node qa/v3-quick-kits.cjs
      - name: Verify ART-01 semantic design tokens
        run: node qa/v3-design-tokens.cjs
      - name: Verify ART-02 original SVGs and integrations
        run: python3 qa/v3-art-assets.py
      - name: Verify ART-03 mission and asset icon variants
        run: node qa/v3-art-variants.cjs
      - name: Verify ART-04 WebP optimization and offline fallback
        run: |
          node --check v3/media-fallback.js
          node qa/v3-media-fallback.cjs
      - name: Verify ART-05 cinematic motion and earned-only award
        run: |
          node --check v3/arcade-gallery.js
          node --check v3/final-achievement.js
          node qa/v3-art-motion.cjs
      - name: Verify FUN-01 hosting and origin policy (offline)
        run: |
          node --check v3/hosting-policy.js
          node qa/v3-hosting-audit.cjs
      - name: Verify FUN-02 isolated registration, token and student progress handlers
        run: |
          node --check qa/v3-isolated-backend.cjs
          node qa/v3-isolated-backend.cjs
      - name: Verify FUN-10 security, accessibility and provenance guards
        run: node qa/v3-security-audit.cjs
      - name: Verify native GDevelop evidence gate with synthetic negative cases
        run: |
          node --check qa/v3-gdevelop-native-results.cjs
          node --check qa/v3-gdevelop-native-results-selftest.cjs
          node qa/v3-gdevelop-native-results-selftest.cjs
      - name: Audit REL-01 release gate (diagnostic, no deployment)
        run: node qa/v3-release-gate.cjs
      - name: Validate core HTML, asset filenames and gamification storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          for file in ("index.html","aluno.html","professor.html","biblioteca.js","cover.jpg"):
              f=root/file
              assert f.exists() and f.stat().st_size > 1000, f
          index=(root/"index.html").read_text()
          aluno=(root/"aluno.html").read_text()
          prof=(root/"professor.html").read_text()
          js=(root/"biblioteca.js").read_text()
          assert index.count('data-filter=') == 6
          assert 'data-role="student"' in aluno and 'data-role="teacher"' in prof
          assert 'v2/missions.js' in aluno and 'v2/app.js' in aluno
          assert 'v2/missions.js' in prof and 'v2/app.js' in prof
          missions=(root/'v2/missions.js').read_text()
          assert len(re.findall(r'\{n:\d+,title:', missions))==10
          assert (root/'v2/style.css').stat().st_size > 10000
          assert (root/'qa/v2-e2e.cjs').stat().st_size > 5000
          assert "glb-bau" in js and "mapa-cidade" in js and "wav-coleta" in js
          ids=re.findall(r"\{id:'([^']+)'", js)
          assert len(ids)==28 and len(set(ids))==28, (len(ids),len(set(ids)))
          assert (root/"cover.jpg").read_bytes()[:3] == b'\xff\xd8\xff'
          print("PASS: V2 10 missions, 28 resources, functioning generators")
          PY
      - name: Test GLB, WAV and SVG resource generators
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const c={document:{querySelector:()=>null,querySelectorAll:()=>[],getElementById:()=>null},
            window:{addEventListener:()=>{}},localStorage:{getItem:()=>null},Blob,TextEncoder,
            ArrayBuffer,DataView,Uint8Array,Float32Array,Uint16Array,Math,URL:{createObjectURL:()=>'',revokeObjectURL:()=>{}},
            setTimeout:()=>{},console};
          vm.createContext(c);
          vm.runInContext(fs.readFileSync('biblioteca.js','utf8'),c,{timeout:3000});
          vm.runInContext("downloadBlob=function(blob,file){globalThis.captured={blob,file}}",c);
          (async()=>{
            for(const id of ['glb-cristal','glb-bau','glb-totem','glb-portal']){
              vm.runInContext("modelDownload(assets.find(a=>a.id==='"+id+"'))",c);
              const buf=Buffer.from(await c.captured.blob.arrayBuffer());
              assert.equal(buf.toString('ascii',0,4),'glTF');
              assert.equal(buf.readUInt32LE(8),buf.length);
              const len=buf.readUInt32LE(12),info=JSON.parse(buf.toString('utf8',20,20+len).trim());
              assert.equal(info.asset.version,'2.0');
              assert.equal(info.meshes.length,1);
            }
            for(const id of ['wav-coleta','wav-vitoria','wav-dano','wav-menu']){
              vm.runInContext("audioDownload(assets.find(a=>a.id==='"+id+"'))",c);
              const buf=Buffer.from(await c.captured.blob.arrayBuffer());
              assert.equal(buf.toString('ascii',0,4),'RIFF');
              assert.equal(buf.toString('ascii',8,12),'WAVE');
            }
            const svg=vm.runInContext("svgAsset(assets.find(a=>a.id==='mapa-floresta'))",c);
            assert(svg.startsWith('<svg') && svg.includes('1024'));
            console.log('PASS: 4 GLB, 4 WAV and map SVG generator');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS