name: V5 H1c Authenticated Hero API + Isolated UI
on:
  push:
    branches: [feature/v5-h1b-integration-safe]
    paths:
      - 'chat-api/api/hero-v2-lab.js'
      - 'chat-api/lib/v5-hero-v2-handler.js'
      - 'chat-api/lib/v5-builds-v2-repository.js'
      - 'chat-api/lib/v5-build-v2-contract.js'
      - 'v5/hero-lab-h1c.html'
      - 'v5/hero-lab-h1c.js'
      - 'v5/hero-v2-client-h1c.js'
      - 'v5/hero-lab-h1c.css'
      - 'v5/phase2-combat.js'
      - 'qa/v5-hero-v2-handler-h1c.cjs'
      - 'qa/v5-hero-v2-client-h1c.cjs'
      - 'qa/v5-hero-h1c-browser.cjs'
      - '.github/workflows/v5-hero-h1c-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check H1c syntax
        run: |
          node --check chat-api/api/hero-v2-lab.js
          node --check chat-api/lib/v5-hero-v2-handler.js
          node --check v5/hero-lab-h1c.js
          node --check v5/hero-v2-client-h1c.js
          node --check qa/v5-hero-v2-client-h1c.cjs
          node --check qa/v5-hero-v2-handler-h1c.cjs
      - name: Assert API isolation, authorization, and progression/locks
        run: |
          node qa/v5-hero-v2-handler-h1c.cjs
          node qa/v5-hero-v2-client-h1c.cjs
          node qa/v5-builds-v2-h1b.cjs
          node qa/v5-student-bridge-h1.cjs
          node qa/v5-progression-contract-h0.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for offline mock preview
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser smoke, no real API traffic
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-h1c-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-hero-h1c-browser.cjs
