name: V5 H2 — Shared Read-Only Arena Feed Fictional QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/shared-arena-feed-h2-lab.js'
      - 'qa/v5-shared-arena-feed-h2.cjs'
      - '.github/workflows/v5-shared-arena-feed-h2-qa.yml'
  workflow_dispatch:
jobs:
  shared-feed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check v5/shared-arena-feed-h2-lab.js
      - run: node --check qa/v5-shared-arena-feed-h2.cjs
      - run: node qa/v5-shared-arena-feed-h2.cjs
      - run: node qa/v5-teacher-arena-release-lab.cjs
