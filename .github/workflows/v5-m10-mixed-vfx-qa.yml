name: V5 H3 — M10 Mixed Talent VFX Timeline
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-mixed-vfx-browser.cjs'
      - '.github/workflows/v5-m10-mixed-vfx-qa.yml'
      - 'v5/arena-three.js'
      - 'v5/arena-lab.js'
      - 'v5/talent-vfx.js'
      - 'v5/talent-sprites.js'
      - 'v5/m10-visual-roster.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-vfx-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate isolated M10 contract and script
        run: |
          node --check qa/v5-m10-mixed-vfx-browser.cjs
          node qa/v5-m10-visual-roster.cjs
          node qa/v5-progression-contract-h0.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run mixed-build talent timeline in real Chromium WebGL
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-m10-mixed-vfx.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-m10-mixed-vfx-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-mixed-vfx-timeline
          path: |
            qa/v5-m10-mixed-vfx-*.png
            qa/v5-m10-mixed-vfx.json
          if-no-files-found: ignore
