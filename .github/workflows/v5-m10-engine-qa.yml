name: V5 M10 — Motor Experimental
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - 'qa/v5-m10-engine.cjs'
      - 'qa/v5-progression-contract-h0.cjs'
      - '.github/workflows/v5-m10-engine-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate syntax
        run: |
          node --check v5/phase2-combat.js
          node --check v5/progression-contract-h0.js
          node --check qa/v5-m10-engine.cjs
      - name: M10 and M5 regressions
        run: |
          node qa/v5-m10-engine.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-endgame-replay.cjs
