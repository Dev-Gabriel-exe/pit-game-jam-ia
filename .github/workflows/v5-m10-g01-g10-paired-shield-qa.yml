name: V5 H3 — M10 G01 G10 Paired Shield Sensitivity
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/phase2-combat.js'
      - 'qa/v5-m10-g01-g10-paired-shield.cjs'
      - '.github/workflows/v5-m10-g01-g10-paired-shield-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g01-g10-paired-shields:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax
        run: |
          node --check v5/phase2-combat.js
          node --check qa/v5-m10-g01-g10-paired-shield.cjs
      - name: Synthetic G01 G10 paired M10 sensitivity and M5 H0 regressions
        env:
          M10_SHIELD_PAIRED_REPORT_FILE: /tmp/v5-m10-g01-g10-paired-shield.json
        run: |
          node qa/v5-m10-g01-g10-paired-shield.cjs
          node qa/v5-m10-guardian-shield-scale.cjs
          node qa/v5-m10-j08-focused.cjs
          node qa/v5-m10-engine.cjs
          node qa/v5-progression-contract-h0.cjs
          node qa/v5-endgame-replay.cjs
      - name: Attach anonymous shield sensitivity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-m10-g01-g10-paired-shield-report
          path: /tmp/v5-m10-g01-g10-paired-shield.json
          if-no-files-found: ignore
          retention-days: 14
