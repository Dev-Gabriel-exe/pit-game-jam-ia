name: V5 M10 — Ordem vs RNG de Críticos
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'qa/v5-m10-order-rng-causal.cjs'
      - 'v5/phase2-combat.js'
      - 'v5/progression-contract-h0.js'
      - '.github/workflows/v5-m10-order-rng-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-order-rng:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check syntax
        run: |
          node --check v5/phase2-combat.js
          node --check qa/v5-m10-order-rng-causal.cjs
      - name: Run isolated actor order and crit RNG interventions
        env:
          M10_CAUSAL_ORDER_REPORT_FILE: ${{ runner.temp }}/m10-order-rng.json
        run: node qa/v5-m10-order-rng-causal.cjs
      - name: M5/M10 regressions
        run: |
          node qa/v5-m10-engine.cjs
          node qa/v5-endgame-replay.cjs
          node qa/v5-progression-contract-h0.cjs
      - name: Archive synthetic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-m10-order-rng-causal
          path: ${{ runner.temp }}/m10-order-rng.json
          if-no-files-found: warn
          retention-days: 14
