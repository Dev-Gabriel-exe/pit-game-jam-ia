name: V5 Fase 1 — quatro heróis 3D reais
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths: ['v5/**', 'qa/v5-fase1*', '.github/workflows/v5-fase1-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check v5/fase1-catalog.js
          node --check v5/seletor.js
          node --check qa/v5-fase1.cjs
          node --check qa/v5-fase1-browser.cjs
          node qa/v5-fase1.cjs
          node qa/v5-classes.cjs
          node qa/v5-core.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/pit-v5-fase1.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-fase1-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-fase1-screenshots
          path: |
            qa/v5-fase1-*.png
            qa/v5-fase1-model-audit.json
          if-no-files-found: ignore
          retention-days: 7
