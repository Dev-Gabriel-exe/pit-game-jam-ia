name: Render Gothic Mission 01 test video
on:
  push:
    branches:
      - experiment/missao-01-gothic-motion
    paths:
      - scripts/render-mission-one.py
      - .github/workflows/render-mission-one.yml
      - v3/assets/missions/missao-01.webp
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source rendering dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.2.1
      - name: Install FFmpeg on minimal runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render silent MP4 from original mission artwork
        run: python scripts/render-mission-one.py
      - name: Check H.264 stream and duration
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json v3/assets/missions/missao-01-motion.mp4
          test -s v3/assets/missions/missao-01-motion.mp4
      - name: Commit generated video only to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/assets/missions/missao-01-motion.mp4
          if ! git diff --cached --quiet; then
            git commit -m "chore(test): render 5s gothic mission 01 video [skip ci]"
            git push
          fi
