name: Verify LTX Generated Video Visuals
on:
  push:
    branches: [experiment/missao-01-ltx-anon]
    paths: ['v3/assets/missions/missao-01-motion.mp4', '.github/workflows/ltx-video-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install local decoder for validation (not a generator)
        run: python -m pip install -q imageio-ffmpeg
      - name: Decode three frames and check video
        run: |
          python - <<'PY'
          from pathlib import Path
          import imageio_ffmpeg,subprocess
          video=Path('v3/assets/missions/missao-01-motion.mp4')
          assert video.stat().st_size > 16000
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          out=Path('experiments/ltx-missao-01-preview')
          out.mkdir(parents=True,exist_ok=True)
          print('FFMPEG',ffmpeg)
          result=subprocess.run([ffmpeg,'-hide_banner','-i',str(video),'-f','null','-'],capture_output=True,text=True)
          print('DECODE_EXIT',result.returncode)
          print(result.stderr[-2200:])
          assert result.returncode == 0, 'Video decode failed'
          for i,at in enumerate((0.1,1.1,2.4),1):
            img=out/f'frame-{i}.jpg'
            subprocess.run([ffmpeg,'-y','-v','error','-ss',str(at),'-i',str(video),'-vf','scale=256:-2','-frames:v','1',str(img)],check=True)
            print('FRAME',i,at,img.stat().st_size)
          assert len({p.read_bytes() for p in out.glob('*.jpg')}) > 1,'Identical frames: possible static output'
          print('PASS: MP4 decoded, frames differ across time')
          PY
      - name: Commit review thumbnails to experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/ltx-missao-01-preview/frame-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "test(ltx): preview actual AI-generated frames [skip ci]"
            git push
          fi