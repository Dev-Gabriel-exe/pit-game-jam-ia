name: V5 H1b — Build Locks and CAS Fictional QA
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/build-lock-cas-h1b-lab.js'
      - 'qa/v5-build-lock-cas-h1b.cjs'
      - '.github/workflows/v5-build-lock-cas-h1b-qa.yml'
  workflow_dispatch:
jobs:
  cas-build-lock-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check v5/build-lock-cas-h1b-lab.js
      - run: node --check qa/v5-build-lock-cas-h1b.cjs
      - run: node qa/v5-build-lock-cas-h1b.cjs
