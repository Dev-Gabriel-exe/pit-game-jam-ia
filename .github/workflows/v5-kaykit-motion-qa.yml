name: V5 KayKit Character Animations 1.1 — M5 and M10
on:
  push:
    branches: [feature/v5-kaykit-motion-mixamo-20261102, main]
    paths:
      - 'v5/kaykit-motion-pack.mjs'
      - 'v5/arena-three.js'
      - 'v5/assets/animations/kaykit/**'
      - 'qa/v5-kaykit-motion*.cjs'
      - 'v3/library-open-assets.js'
      - '.github/workflows/v5-kaykit-motion-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  animation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check v5/kaykit-motion-pack.mjs
          node --input-type=module --check < v5/arena-three.js
          node --check v3/library-open-assets.js
          node qa/v5-kaykit-motion.cjs
          node qa/v5-talent-cinematic.cjs
          node qa/v3-audit-matrix.cjs
  animation-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/kaykit-motion-webgl.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-kaykit-motion-browser.cjs
