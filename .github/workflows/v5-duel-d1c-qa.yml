name: V5 D1c 30-Student Lobby + Teacher QA
on:
  push:
    branches: [feature/v5-duelos-d1c]
    paths:
      - 'chat-api/lib/v5-duel-*'
      - 'chat-api/api/duel-teacher-v2-lab.js'
      - 'v5/duel-client-d1c.js'
      - 'v5/duel-lobby-d1c.*'
      - 'v5/duel-teacher-d1c.*'
      - 'v5/duel-replay-d1b.js'
      - 'qa/v5-duel-d1c-*.cjs'
      - '.github/workflows/v5-duel-d1c-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirty-students:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: pit_v5_d1c_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pit_v5_d1c_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pit_v5_d1c_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and pinned authoritative engine
        run: |
          cmp -s chat-api/lib/v5-duel-phase2-engine.js v5/phase2-combat.js
          node --check chat-api/lib/v5-duel-d1c-teacher.js
          node --check chat-api/api/duel-teacher-v2-lab.js
          node --check v5/duel-client-d1c.js
          node --check v5/duel-lobby-d1c.js
          node --check v5/duel-teacher-d1c.js
          node --check v5/duel-replay-d1b.js
          node --check qa/v5-duel-d1c-30students.cjs
      - name: Install disposable database driver
        run: npm install --no-save --no-package-lock pg@8.13.1
      - name: Migrate only temporary test PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f qa/v5-h1d-staging-schema.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE pit_students ADD COLUMN display_name text NOT NULL DEFAULT 'Aluno fictício'"
          psql -v ON_ERROR_STOP=1 -f v5/migration-h1b-builds-v2.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1a-duelos.sql
          psql -v ON_ERROR_STOP=1 -f v5/migration-d1b-duel-matches.sql
      - name: Verify 30 student permissions and 15 concurrent pairings
        run: node qa/v5-duel-d1c-30students.cjs
