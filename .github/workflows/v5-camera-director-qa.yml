name: V5 F1 — Diretor Cinematográfico Automático
on:
  push:
    branches: [feature/v5-arena-dos-criadores]
    paths:
      - 'v5/camera-director.js'
      - 'v5/camera-framing.js'
      - 'v5/arena-three.js'
      - 'v5/arena-lab.js'
      - 'v5/arena-lab.html'
      - 'qa/v5-camera-director.cjs'
      - 'qa/v5-camera-framing.cjs'
      - 'qa/v5-camera-victory-browser.cjs'
      - 'qa/v5-camera-director-browser.cjs'
      - '.github/workflows/v5-camera-director-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          node --check v5/camera-director.js
          node --check v5/camera-framing.js
          node --check v5/arena-three.js
          node --check v5/arena-lab.js
          node --check qa/v5-camera-director.cjs
          node --check qa/v5-camera-framing.cjs
          node --check qa/v5-camera-director-browser.cjs
          node --check qa/v5-camera-victory-browser.cjs
          node qa/v5-camera-director.cjs
          node qa/v5-camera-framing.cjs
          node qa/v5-endgame-replay.cjs
  browser-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v5-f1-camera.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/v5-camera-director-browser.cjs
          node qa/v5-camera-victory-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-f2-camera-webgl-30
          path: |
            qa/v5-camera-director-f2-30.png
            qa/v5-camera-f2-victory-30.png
          if-no-files-found: ignore
