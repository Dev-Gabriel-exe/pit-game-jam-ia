name: PIT Game Jam — Projector Content Audit
on:
  push:
    paths:
      - 'qa/v3-projector-content-audit.cjs'
      - 'v3/teacher-projector-m01.js'
      - 'v3/teacher-projector-m01.css'
      - '.github/workflows/projector-content-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { width: 1280, height: 720 }
          - { width: 1600, height: 900 }
          - { width: 1920, height: 1080 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.58.2
      - name: Start isolated local static site
        run: python3 -m http.server 8899 --bind 127.0.0.1 > /tmp/pit-projection.log 2>&1 &
      - name: Audit all ten missions and four teacher phases in Chrome
        run: node qa/v3-projector-content-audit.cjs
        env:
          PIT_AUDIT_WIDTH: ${{ matrix.width }}
          PIT_AUDIT_HEIGHT: ${{ matrix.height }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projector-audit-${{ matrix.width }}x${{ matrix.height }}
          path: qa/projector-audit-artifacts/
          retention-days: 7
