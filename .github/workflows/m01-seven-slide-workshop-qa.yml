name: Mission 01 — workshop seven-slide pilot QA
on:
  push:
    branches: [feature/m01-oficina-7-telas-20261028]
  pull_request:
    paths:
      - 'v3/teacher-projector-m01-workshop.*'
      - 'professor-v3.html'
      - 'qa/m01-seven-slide-workshop.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check practical M01 teacher projection
        run: |
          node --check v3/teacher-projector-m01-workshop.js
          node --check qa/m01-seven-slide-workshop.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/m01-seven.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node qa/m01-seven-slide-workshop.cjs
