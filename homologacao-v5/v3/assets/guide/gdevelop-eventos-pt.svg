<rect x="421" y="23" width="145" height="38" rx="4" fill="#353744"/>
<text x="441" y="47" font-family="Arial,sans-serif" font-size="17" fill="#c8cad6">Cena 1</text>
<rect x="572" y="23" width="191" height="38" rx="4" fill="#573326" stroke="#dda06c"/>
<text x="591" y="47" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffe3b6">Cena 1 (Eventos)</text>
<rect x="15" y="70" width="1250" height="64" fill="#292a33"/>
<rect x="39" y="86" width="167" height="33" rx="5" fill="#5b3828" stroke="#dcb27b"/>
<text x="52" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffe1b7">＋ Adicionar evento</text>
<rect x="217" y="86" width="192" height="33" rx="4" fill="#353540" stroke="#615e64"/>
<text x="231" y="108" font-family="Arial,sans-serif" font-size="15" fill="#d0c5be">＋ Adicionar subevento</text>
<text x="1089" y="109" font-family="Arial,sans-serif" font-size="16" fill="#d8cdbe">▶ Prévia</text>
<rect x="40" y="161" width="1201" height="61" rx="4" fill="#322c2a" stroke="#82624b"/>
<rect x="40" y="162" width="569" height="59" rx="3" fill="#443126"/>
<rect x="609" y="162" width="631" height="59" rx="3" fill="#2c3832"/>
<text x="66" y="184" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#f1b777">COLUNA 1</text>
<text x="66" y="208" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#ffe2b8">SE · CONDIÇÕES</text>
<text x="637" y="184" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#a9cfb0">COLUNA 2</text>
<text x="637" y="208" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#e4ffe8">ENTÃO · AÇÕES</text>
<!-- event 1 -->
<rect x="40" y="236" width="1201" height="159" rx="6" fill="#21232c" stroke="#976d50"/>
<rect x="40" y="236" width="1201" height="35" rx="5" fill="#423026"/>
<text x="59" y="259" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#f7d7aa">EVENTO 01 · COLETA DO CRISTAL</text>
<line x1="608" y1="272" x2="608" y2="394" stroke="#624d40" stroke-width="2"/>
<rect x="58" y="287" width="533" height="89" rx="5" fill="#323039" stroke="#706071"/>
<rect x="72" y="302" width="88" height="25" rx="3" fill="#453c50"/><text x="85" y="320" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#dec9f1">Colisão</text>
<text x="176" y="321" font-family="Arial,sans-serif" font-size="18" fill="#ece3db">Jogador toca Cristal</text>
<text x="76" y="357" font-family="Arial,sans-serif" font-size="15" fill="#baaeb5">Seleciona somente o Cristal tocado</text>
