<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="t d">
<title id="t">Esquema didático do editor de eventos do GDevelop, com condições e ações em português</title>
<desc id="d">Uma janela de editor mostra a aba Cena 1 e a aba Eventos, duas colunas: à esquerda condições e à direita ações. O primeiro evento verifica colisão de Jogador com Cristal e aumenta a variável cristais; o segundo verifica Jogador colidir com Porta e variável cristais maior ou igual a 3 e exibe a cena de vitória.</desc>
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1c1d26"/><stop offset="1" stop-color="#13151b"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f7cd8c"/><stop offset="1" stop-color="#be7544"/></linearGradient>
<filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".48"/></filter>
</defs>
<rect width="1280" height="690" fill="#090b0e"/>
<rect x="15" y="13" width="1250" height="657" rx="11" fill="url(#bg)" stroke="#8f674c" stroke-width="2" filter="url(#s)"/>
<rect x="16" y="14" width="1248" height="56" rx="10" fill="#232630"/>
<rect x="17" y="60" width="1246" height="10" fill="#232630"/>
<circle cx="42" cy="41" r="6" fill="#d8735d"/><circle cx="61" cy="41" r="6" fill="#e6b56a"/><circle cx="80" cy="41" r="6" fill="#76ad83"/>
