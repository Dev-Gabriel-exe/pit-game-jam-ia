<text x="646" y="311" font-family="Arial,sans-serif" font-size="18" fill="#e1f5d9">Excluir a instância selecionada de Cristal</text>
<rect x="625" y="334" width="596" height="42" rx="4" fill="#283c36" stroke="#56816a"/>
<text x="646" y="361" font-family="Arial,sans-serif" font-size="18" fill="#e1f5d9">Somar +1 à variável de cena cristais</text>
<!-- event 2 -->
<rect x="40" y="411" width="1201" height="174" rx="6" fill="#21232c" stroke="#976d50"/>
<rect x="40" y="411" width="1201" height="35" rx="5" fill="#423026"/>
<text x="59" y="434" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#f7d7aa">EVENTO 02 · ABERTURA DA PORTA</text>
<line x1="608" y1="447" x2="608" y2="583" stroke="#624d40" stroke-width="2"/>
<rect x="58" y="462" width="533" height="47" rx="4" fill="#323039" stroke="#706071"/>
<text x="75" y="492" font-family="Arial,sans-serif" font-size="17" fill="#ece3db">Jogador toca Porta</text>
<rect x="58" y="517" width="533" height="48" rx="4" fill="#323039" stroke="#706071"/>
<text x="75" y="546" font-family="Arial,sans-serif" font-size="17" fill="#ece3db">Variável de cena cristais ≥ 3</text>
<rect x="625" y="462" width="596" height="103" rx="4" fill="#283c36" stroke="#56816a"/>
<text x="645" y="500" font-family="Arial,sans-serif" font-size="18" fill="#e1f5d9">Executar efeito de conclusão</text>
<text x="645" y="533" font-family="Arial,sans-serif" font-size="16" fill="#c7ddc4">Ex.: alterar a cena ou mostrar vitória</text>
<rect x="40" y="602" width="1201" height="46" rx="4" fill="#35261d" stroke="#9a673e"/>
<text x="58" y="631" font-family="Arial,sans-serif" font-size="16" fill="#f7d6ad">✓ A condição precisa ser verdadeira para as ações daquele evento acontecerem.</text>
<text x="1101" y="631" font-family="Arial,sans-serif" font-size="13" fill="#c8a98a">ILUSTRAÇÃO DIDÁTICA</text>
